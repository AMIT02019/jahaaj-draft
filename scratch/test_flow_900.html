<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test 900 900 Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #f1f5f9;
      padding: 40px;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 1100px;
      background: #eef3f6;
      border: 1px solid #dce5ec;
      border-radius: 24px;
      padding: 34px 28px 28px;
      box-shadow: 0 12px 36px rgba(14, 50, 82, 0.06);
    }
    svg { width: 100%; height: auto; }
    .flow-title { font-weight: 700; font-size: 25px; text-anchor: middle; dominant-baseline: middle; }
    .flow-desc { font-weight: 500; font-size: 16px; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
    .darkline { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

    .continuous-line-flow {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 800 1000;
      animation: lineFlowStartToEnd 3.2s linear infinite;
      filter: drop-shadow(0 0 5px rgba(234, 88, 12, 0.45));
    }
    @keyframes lineFlowStartToEnd {
      0% {
        stroke-dashoffset: 1800;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <svg viewBox="0 0 1255 357">
      <defs>
        <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#e5a800" />
          <stop offset="33%" stop-color="#16a34a" />
          <stop offset="66%" stop-color="#0284c7" />
          <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
      </defs>

      <!-- Constant Text Group -->
      <g>
        <!-- 1. Idea & Concept (Yellow / Amber) -->
        <g id="text-step-1">
          <text x="253" y="152" class="flow-title" fill="#e5a800">Idea &amp;</text>
          <text x="253" y="184" class="flow-title" fill="#e5a800">Concept</text>
          <text x="253" y="216" class="flow-desc">Define vision and</text>
          <text x="253" y="238" class="flow-desc">feasibility</text>
        </g>

        <!-- 2. Formulation & R&D (Green) -->
        <g id="text-step-2">
          <text x="501" y="122" class="flow-title" fill="#16a34a">Formulation &amp;</text>
          <text x="501" y="154" class="flow-title" fill="#16a34a">R&amp;D</text>
          <text x="501" y="186" class="flow-desc">Develop formulas</text>
          <text x="501" y="208" class="flow-desc">and lab testing</text>
        </g>

        <!-- 3. Trial & Optimization (Blue) -->
        <g id="text-step-3">
          <text x="748" y="152" class="flow-title" fill="#0284c7">Trial &amp;</text>
          <text x="748" y="184" class="flow-title" fill="#0284c7">Optimization</text>
          <text x="748" y="216" class="flow-desc">Scale-up trials and</text>
          <text x="748" y="238" class="flow-desc">refine process</text>
        </g>

        <!-- 4. Manufacturing & Commercialization (Red / Coral) -->
        <g id="text-step-4">
          <text x="995" y="122" class="flow-title" fill="#ef4444">Manufacturing &amp;</text>
          <text x="995" y="154" class="flow-title" fill="#ef4444">Commercialization</text>
          <text x="995" y="186" class="flow-desc">Produce at scale</text>
          <text x="995" y="208" class="flow-desc">and launch</text>
        </g>
      </g>

      <!-- Base Dark Track (Constant Structure) -->
      <path class="darkline" d="M 48 175 L 128 175 C 128 92, 180 48, 253 48 C 325 48, 378 92, 378 168 C 378 255, 430 302, 501 302 C 572 302, 625 255, 625 178 C 625 92, 677 48, 748 48 C 820 48, 872 92, 872 168 C 872 255, 924 302, 995 302 C 1066 302, 1118 255, 1118 175 L 1195 175" />

      <!-- The Flowing Line (Flows from start to end in continuous loop) -->
      <path class="continuous-line-flow" stroke="url(#streamGrad)" d="M 48 175 L 128 175 C 128 92, 180 48, 253 48 C 325 48, 378 92, 378 168 C 378 255, 430 302, 501 302 C 572 302, 625 255, 625 178 C 625 92, 677 48, 748 48 C 820 48, 872 92, 872 168 C 872 255, 924 302, 995 302 C 1066 302, 1118 255, 1118 175 L 1195 175" />

      <!-- Start Node (Static) -->
      <circle cx="48" cy="175" r="9" fill="#334155" />

      <!-- Arrowheads -->
      <path fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 368 152 L 378 168 L 390 156" />
      <path fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 614 194 L 625 178 L 637 190" />
      <path fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 862 152 L 872 168 L 884 156" />
      <path fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 1180 162 L 1195 175 L 1180 188" />
    </svg>
  </div>

</body>
</html>
