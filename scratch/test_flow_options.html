<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flow Animation Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #f1f5f9;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 50px;
      align-items: center;
    }
    .demo-box {
      width: 100%;
      max-width: 1050px;
      background: #eef3f6;
      border: 1px solid #dce5ec;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    h2 {
      margin: 0 0 16px;
      font-size: 18px;
      color: #0e3252;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .flow-title {
      font-weight: 700;
      font-size: 25px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .flow-desc {
      font-weight: 500;
      font-size: 16px;
      fill: #475569;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .base-path {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ================= OPTION 1: TRAVELING LINE STREAM (NO DOTS) ================= */
    /* A long glowing stream of 550px that flows smoothly from start (0) to end (1800) in loop */
    .stream-line-opt1 {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 600 1800;
      animation: opt1Flow 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      filter: drop-shadow(0 0 6px rgba(234, 88, 12, 0.5));
    }
    @keyframes opt1Flow {
      0% {
        stroke-dashoffset: 2400;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* ================= OPTION 2: FULL LINE DRAW AND RETRACT/WIPE LOOP ================= */
    .stream-line-opt2 {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1800;
      animation: opt2DrawLoop 4.5s ease-in-out infinite;
      filter: drop-shadow(0 0 5px rgba(14, 50, 82, 0.3));
    }
    @keyframes opt2DrawLoop {
      0% {
        stroke-dashoffset: 1800;
        opacity: 0.2;
      }
      10% {
        opacity: 1;
      }
      50% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      75% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      90% {
        stroke-dashoffset: -1800;
        opacity: 0;
      }
      100% {
        stroke-dashoffset: -1800;
        opacity: 0;
      }
    }

    /* ================= OPTION 3: TWO FLOWING BEAMS IN RHYTHMIC HARMONY ================= */
    .stream-line-opt3 {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 450 450;
      animation: opt3Stream 3s linear infinite;
    }
    @keyframes opt3Stream {
      0% {
        stroke-dashoffset: 900;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>

  <!-- ================= OPTION 1 ================= -->
  <div class="demo-box">
    <h2>Option 1: Single Long Flowing Line Stream (No dots, travels start-to-end continuously in loop)</h2>
    <svg viewBox="0 0 1255 357">
      <defs>
        <linearGradient id="opt1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#eab308" />
          <stop offset="33%" stop-color="#16a34a" />
          <stop offset="66%" stop-color="#0284c7" />
          <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
      </defs>

      <!-- Constant Text -->
      <g>
        <text x="253" y="152" class="flow-title" fill="#e5a800">Idea &amp;</text>
        <text x="253" y="184" class="flow-title" fill="#e5a800">Concept</text>
        <text x="253" y="216" class="flow-desc">Define vision and</text>
        <text x="253" y="238" class="flow-desc">feasibility</text>

        <text x="501" y="122" class="flow-title" fill="#16a34a">Formulation &amp;</text>
        <text x="501" y="154" class="flow-title" fill="#16a34a">R&amp;D</text>
        <text x="501" y="186" class="flow-desc">Develop formulas</text>
        <text x="501" y="208" class="flow-desc">and lab testing</text>

        <text x="748" y="152" class="flow-title" fill="#0284c7">Trial &amp;</text>
        <text x="748" y="184" class="flow-title" fill="#0284c7">Optimization</text>
        <text x="748" y="216" class="flow-desc">Scale-up trials and</text>
        <text x="748" y="238" class="flow-desc">refine process</text>

        <text x="995" y="122" class="flow-title" fill="#ef4444">Manufacturing &amp;</text>
        <text x="995" y="154" class="flow-title" fill="#ef4444">Commercialization</text>
        <text x="995" y="186" class="flow-desc">Produce at scale</text>
        <text x="995" y="208" class="flow-desc">and launch</text>
      </g>

      <!-- Base Guide Path -->
      <path class="base-path" fill="none" d="M 48 175 L 128 175 C 128 92, 180 48, 253 48 C 325 48, 378 92, 378 168 C 378 255, 430 302, 501 302 C 572 302, 625 255, 625 178 C 625 92, 677 48, 748 48 C 820 48, 872 92, 872 168 C 872 255, 924 302, 995 302 C 1066 302, 1118 255, 1118 175 L 1195 175" />

      <!-- Flowing Line -->
      <path class="stream-line-opt1" stroke="url(#opt1Grad)" fill="none" d="M 48 175 L 128 175 C 128 92, 180 48, 253 48 C 325 48, 378 92, 378 168 C 378 255, 430 302, 501 302 C 572 302, 625 255, 625 178 C 625 92, 677 48, 748 48 C 820 48, 872 92, 872 168 C 872 255, 924 302, 995 302 C 1066 302, 1118 255, 1118 175 L 1195 175" />

      <!-- Fixed Start Dot (static starting node of diagram) -->
      <circle cx="48" cy="175" r="9" fill="#475569" />

      <!-- Arrowheads -->
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 368 152 L 378 168 L 390 156" />
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 614 194 L 625 178 L 637 190" />
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 862 152 L 872 168 L 884 156" />
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 1180 162 L 1195 175 L 1180 188" />
    </svg>
  </div>

  <!-- ================= OPTION 2 ================= -->
  <div class="demo-box">
    <h2>Option 2: Full Line Draws from Start to End, then Repeats in Smooth Loop</h2>
    <svg viewBox="0 0 1255 357">
      <!-- Constant Text -->
      <g>
        <text x="253" y="152" class="flow-title" fill="#e5a800">Idea &amp;</text>
        <text x="253" y="184" class="flow-title" fill="#e5a800">Concept</text>
        <text x="253" y="216" class="flow-desc">Define vision and</text>
        <text x="253" y="238" class="flow-desc">feasibility</text>

        <text x="501" y="122" class="flow-title" fill="#16a34a">Formulation &amp;</text>
        <text x="501" y="154" class="flow-title" fill="#16a34a">R&amp;D</text>
        <text x="501" y="186" class="flow-desc">Develop formulas</text>
        <text x="501" y="208" class="flow-desc">and lab testing</text>

        <text x="748" y="152" class="flow-title" fill="#0284c7">Trial &amp;</text>
        <text x="748" y="184" class="flow-title" fill="#0284c7">Optimization</text>
        <text x="748" y="216" class="flow-desc">Scale-up trials and</text>
        <text x="748" y="238" class="flow-desc">refine process</text>

        <text x="995" y="122" class="flow-title" fill="#ef4444">Manufacturing &amp;</text>
        <text x="995" y="154" class="flow-title" fill="#ef4444">Commercialization</text>
        <text x="995" y="186" class="flow-desc">Produce at scale</text>
        <text x="995" y="208" class="flow-desc">and launch</text>
      </g>

      <!-- Base Guide Path -->
      <path class="base-path" fill="none" d="M 48 175 L 128 175 C 128 92, 180 48, 253 48 C 325 48, 378 92, 378 168 C 378 255, 430 302, 501 302 C 572 302, 625 255, 625 178 C 625 92, 677 48, 748 48 C 820 48, 872 92, 872 168 C 872 255, 924 302, 995 302 C 1066 302, 1118 255, 1118 175 L 1195 175" />

      <!-- Drawing Line -->
      <path class="stream-line-opt2" stroke="url(#opt1Grad)" fill="none" d="M 48 175 L 128 175 C 128 92, 180 48, 253 48 C 325 48, 378 92, 378 168 C 378 255, 430 302, 501 302 C 572 302, 625 255, 625 178 C 625 92, 677 48, 748 48 C 820 48, 872 92, 872 168 C 872 255, 924 302, 995 302 C 1066 302, 1118 255, 1118 175 L 1195 175" />

      <circle cx="48" cy="175" r="9" fill="#475569" />

      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 368 152 L 378 168 L 390 156" />
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 614 194 L 625 178 L 637 190" />
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 862 152 L 872 168 L 884 156" />
      <path fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 1180 162 L 1195 175 L 1180 188" />
    </svg>
  </div>

</body>
</html>
