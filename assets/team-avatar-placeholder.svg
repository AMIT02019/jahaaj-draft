<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <rect width="198" height="198" x="1" y="1" rx="35" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Subtle pattern / circular accent -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  
  <!-- Headshot Silhouette -->
  <g fill="url(#avatarGrad)">
    <!-- Head -->
    <circle cx="100" cy="76" r="32"/>
    <!-- Shoulders & Torso with Collar Cutout -->
    <path d="M48 168 C48 126, 70 120, 88 118 L92 134 L108 134 L112 118 C130 120, 152 126, 152 168 Z"/>
  </g>
  
  <!-- Tie / Lapel Accent for Professional Touch -->
  <path d="M96 134 L100 156 L104 134 Z" fill="#475569" opacity="0.4"/>
  
  <!-- Camera / Add Photo Badge Icon in Bottom Right -->
  <g transform="translate(132, 132)">
    <circle cx="24" cy="24" r="22" fill="#ffffff"/>
    <circle cx="24" cy="24" r="19" fill="url(#accentGrad)"/>
    <!-- Camera icon glyph -->
    <path d="M18 20 L20 17 L28 17 L30 20 L33 20 C34.1 20 35 20.9 35 22 L35 30 C35 31.1 34.1 32 33 32 L15 32 C13.9 32 13 31.1 13 30 L13 22 C13 20.9 13.9 20 15 20 Z" fill="#ffffff"/>
    <circle cx="24" cy="26" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>